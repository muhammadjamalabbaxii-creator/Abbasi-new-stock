<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Abbasi Mobile</title><style>body{margin:0;font-family:sans-serif;background:#eef5ee}.h{background:#0b5d1e;color:#fff;padding:20px;text-align:center}.c{max-width:800px;margin:auto;padding:15px}.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:14px;background:#0b5d1e;color:#fff;border:0;border-radius:8px;font-weight:bold}table{width:100%;border-collapse:collapse}th{background:#0b5d1e;color:#fff;padding:8px}td{padding:8px;border-bottom:1px solid #eee;text-align:center}</style></head><body><div class="h"><h1>Abbasi Mobile - Bhara Kahu</h1><p>Manager: Jamal Abbasi</p></div><div class="c"><div class="card"><input id="m" placeholder="Model: iPhone 11"><input id="s" placeholder="Storage: 128GB"><input id="no" placeholder="Model No: MWM62TA/A"><input id="p" type="number" placeholder="Price"><button onclick="add()">Stock Save Karo</button></div><div class="card" style="padding:0"><table id="t"><tr><th>Model</th><th>Detail</th><th>Price</th></tr></table></div></div><script>let d=JSON.parse(localStorage.getItem('abbasi')||'[]');show();function add(){let a=m.value,b=s.value,c=no.value,f=p.value;if(!a||!f)return alert('Model Price likho');d.unshift({model:a,storage:b,mno:c,price:f,date:new Date().toLocaleDateString()});localStorage.setItem('abbasi',JSON.stringify(d));show();m.value='';p.value='';}function show(){t.innerHTML='<tr><th>Model</th><th>Detail</th><th>Price</th></tr>';d.forEach(x=>{t.innerHTML+=`<tr><td><b>${x.model}</b><br>${x.storage}</td><td>${x.mno}<br>${x.date}</td><td>Rs.${x.price}</td></tr>`})}</script></body></html>
